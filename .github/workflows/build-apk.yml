name: Compilar APK

# Se dispara solo cuando cambia algo del APK. Cada compilación:
#   1. sube el APK a Releases (de donde el celular lo baja)
#   2. actualiza version.json para que el celular sepa que hay algo nuevo

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Buscar la keystore guardada
        id: firma
        env:
          SECRETO: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SECRETO" ]; then
            echo "$SECRETO" | base64 -d > "$GITHUB_WORKSPACE/mixi.jks"
            echo "origen=secreto" >> "$GITHUB_OUTPUT"
            echo "Usando la keystore guardada en Secrets"
          else
            echo "origen=nueva" >> "$GITHUB_OUTPUT"
            echo "No hay keystore guardada: se creara una"
          fi

      - name: Crear keystore (solo si no existe una guardada)
        if: steps.firma.outputs.origen == 'nueva'
        run: |
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/mixi.jks" -alias mixi \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mixi-clave-2026 -keypass mixi-clave-2026 \
            -dname "CN=Mixi, OU=Fire, O=Fire, L=Lima, C=PE"

      - name: Dejar la keystore descargable (para guardarla en Secrets)
        if: steps.firma.outputs.origen == 'nueva'
        uses: actions/upload-artifact@v4
        with:
          name: GUARDAR-ESTA-KEYSTORE-EN-SECRETS
          path: mixi.jks

      - name: Compilar
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/mixi.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'mixi-clave-2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'mixi' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'mixi-clave-2026' }}
        run: >
          gradle assembleRelease --no-daemon --stacktrace
          -PversionCode=${{ github.run_number }}
          -PversionName=1.0.${{ github.run_number }}

      - name: Preparar el APK
        run: cp android/app/build/outputs/apk/release/app-release.apk mixi.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Mixi 1.0.${{ github.run_number }}
          body: Compilación automática 1.0.${{ github.run_number }}
          files: mixi.apk

      - name: Avisarle al celular que hay versión nueva
        run: |
          NUM=${{ github.run_number }}
          sed -i "s/\"versionCode\": *[0-9]*/\"versionCode\": $NUM/" web/version.json
          sed -i "s/\"versionName\": \"[^\"]*\"/\"versionName\": \"1.0.$NUM\"/" web/version.json
          git config user.name "mixi-bot"
          git config user.email "mixi-bot@users.noreply.github.com"
          git add web/version.json
          git commit -m "chore: version.json -> 1.0.$NUM" || echo "sin cambios que subir"
          git push || echo "nada que subir"
